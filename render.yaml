# Render blueprint — čita se automatski kad povežeš repo sa Render-om.
services:
  - type: web
    name: generator-glasa
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
